name: Agent Evaluation Gate
on:
  workflow_dispatch:
jobs:
  agent-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-kernel/eval-orchestrator build
      - name: Evaluate release gate
        run: node packages/eval-orchestrator/dist/bin/eval-ci.js --decision "$AGENT_EVAL_GATE_DECISION" --report-manifest "$AGENT_EVAL_REPORT_MANIFEST" --report-url "$AGENT_EVAL_REPORT_URL" --output-dir agent-evaluation-ci
      - name: Publish SARIF annotations
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: agent-evaluation-ci/gate.sarif.json }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: agent-evaluation-ci, path: agent-evaluation-ci }
