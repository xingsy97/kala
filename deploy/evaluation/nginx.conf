access_log off;
error_log /tmp/nginx-error.log notice;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $orchestrator_upstream orchestrator;

  # Bound dashboard uploads and request bodies without buffering SSE responses.
  client_max_body_size 25m;
  client_body_timeout 30s;
  send_timeout 75s;

  location /api/ {
    proxy_pass http://$orchestrator_upstream:13100;
    proxy_set_header Authorization "Bearer __AGENT_EVAL_DASHBOARD_TOKEN__";
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 75s;
    # Keep event streams unbuffered; do not add location-level response headers,
    # because that would suppress inheritance of the server security headers.
    proxy_buffering off;
    proxy_cache off;
  }
  location = /healthz { proxy_pass http://orchestrator:13100/healthz; }
  location / { try_files $uri $uri/ /index.html; }
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
}
