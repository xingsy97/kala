access_log off;
error_log /tmp/nginx-error.log notice;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $orchestrator_upstream orchestrator;

  client_max_body_size 25m;
  client_body_timeout 30s;
  send_timeout 75s;

  # The BFF credential is deliberately confined to read-only endpoints. The
  # query endpoint is POST because its typed request does not fit a URL, but it
  # cannot mutate Control Plane state. Incoming user Authorization is replaced.
  location = /api/v1/capabilities {
    proxy_pass http://$orchestrator_upstream:13100;
    proxy_set_header Authorization "Bearer __AGENT_EVAL_DASHBOARD_READ_TOKEN__";
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  location = /api/v1/query {
    limit_except POST { deny all; }
    proxy_pass http://$orchestrator_upstream:13100;
    proxy_set_header Authorization "Bearer __AGENT_EVAL_DASHBOARD_READ_TOKEN__";
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  location = /api/v1/administration/status {
    limit_except GET { deny all; }
    proxy_pass http://$orchestrator_upstream:13100;
    proxy_set_header Authorization "Bearer __AGENT_EVAL_DASHBOARD_READ_TOKEN__";
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  location ~ ^/api/v1/(artifacts|reports|archive-documents)/ {
    limit_except GET { deny all; }
    proxy_pass http://$orchestrator_upstream:13100;
    proxy_set_header Authorization "Bearer __AGENT_EVAL_DASHBOARD_READ_TOKEN__";
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  location = /api/v1/events {
    limit_except GET { deny all; }
    proxy_pass http://$orchestrator_upstream:13100;
    proxy_set_header Authorization "Bearer __AGENT_EVAL_DASHBOARD_READ_TOKEN__";
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "private, no-cache, no-store" always;
    add_header X-Accel-Buffering "no" always;
    include /opt/agent-evaluation/security-headers.conf;
  }

  # Mutations receive only the caller's user credential; no shared credential
  # is injected. The Control Plane remains the authorization authority.
  location /api/ {
    proxy_pass http://$orchestrator_upstream:13100;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "private, no-store" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  location = /healthz { proxy_pass http://$orchestrator_upstream:13100/healthz; }
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  location ~* "^/assets/.+\.[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|png|svg)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /opt/agent-evaluation/security-headers.conf;
  }
  include /opt/agent-evaluation/security-headers.conf;
}
