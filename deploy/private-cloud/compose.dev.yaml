# Source-build override. This file is for repository development and acceptance only.
# Public release bundles never contain it.
services:
  control-plane-init:
    image: kala-private-cloud-ingress:dev
    build:
      context: ../..
      dockerfile: deploy/private-cloud/images/Dockerfile.runtime-ingress-gateway

  runtime-host:
    image: kala-private-cloud-runtime:dev
    build:
      context: ../..
      dockerfile: deploy/private-cloud/images/Dockerfile.runtime-service

  dashboard:
    image: kala-private-cloud-dashboard:dev
    build:
      context: ../..
      dockerfile: deploy/private-cloud/images/Dockerfile.dashboard

  runtime-ingress:
    image: kala-private-cloud-ingress:dev
    build:
      context: ../..
      dockerfile: deploy/private-cloud/images/Dockerfile.runtime-ingress-gateway
