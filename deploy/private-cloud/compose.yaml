name: agent-runlab-private-cloud

services:
  init-volumes:
    image: alpine@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    user: "0:0"
    command: [/bin/sh, -ec, "mkdir -p /tenant /control && chown -R 10001:10001 /tenant /control && chmod 700 /tenant /control"]
    volumes:
      - tenant-data:/tenant
      - control-data:/control
    networks: [runtime]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true

  init-app-secrets:
    image: alpine@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        cp /run/secrets/ingress_secret /host/ingress_secret
        cp /run/secrets/llm_api_key /host/llm_api_key
        cp /run/secrets/ingress_secret /gateway/ingress_secret
        cp /run/secrets/session_secret /gateway/session_secret
        cp /run/secrets/oidc_client_id /gateway/oidc_client_id
        cp /run/secrets/oidc_client_secret /gateway/oidc_client_secret
        printf 'postgresql://runlab:%s@control-postgres:5432/runlab_control?sslmode=disable' "$$(cat /run/secrets/control_postgres_password)" > /gateway/control_database_url
        chown -R 10001:10001 /host /gateway
        chmod 700 /host /gateway
        chmod 400 /host/* /gateway/*
    secrets: [ingress_secret, llm_api_key, session_secret, oidc_client_id, oidc_client_secret, control_postgres_password]
    volumes:
      - host-secrets:/host
      - gateway-secrets:/gateway
    networks: [runtime]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true

  control-postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    environment:
      POSTGRES_DB: runlab_control
      POSTGRES_USER: runlab
      POSTGRES_PASSWORD_FILE: /run/secrets/control_postgres_password
    secrets: [control_postgres_password]
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, pg_isready -d runlab_control -U runlab]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 200
    mem_limit: 512m
    cpus: 0.5

  control-plane-init:
    image: ${RUNLAB_INGRESS_IMAGE:?RUNLAB_INGRESS_IMAGE must be an immutable name@sha256 digest}
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/control_postgres_password)"
        export RUNTIME_INGRESS_ADMIN_DATABASE_URL="postgresql://runlab:$$password@control-postgres:5432/postgres?sslmode=disable"
        export RUNTIME_INGRESS_DATABASE_URL="postgresql://runlab:$$password@control-postgres:5432/runlab_control?sslmode=disable"
        export RUNTIME_INGRESS_MIGRATIONS_DIR=/app/packages/runtime-ingress-gateway/migrations
        node /app/packages/runtime-ingress-gateway/dist/src/bin/init-control-plane.js
        chown -R 10001:10001 /control
        if [ -f /control/tenant-directory.json ]; then
          export RUNTIME_INGRESS_JSON_DIRECTORY=/control/tenant-directory.json
          export RUNTIME_INGRESS_JSON_SESSIONS=/control/login-states.json.sessions
          export RUNTIME_INGRESS_JSON_BACKUP_PREFIX=/control/pre-postgres
          node /app/packages/runtime-ingress-gateway/dist/src/bin/import-json-control.js
        fi
    secrets: [control_postgres_password]
    volumes:
      - control-data:/control
    networks: [control]
    depends_on:
      control-postgres: { condition: service_healthy }
      init-volumes: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

  runtime-host:
    image: ${RUNLAB_RUNTIME_IMAGE:?RUNLAB_RUNTIME_IMAGE must be an immutable name@sha256 digest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    environment:
      RUNTIME_HOST_PORT: 13002
      RUNTIME_HOST_LISTEN_HOST: 0.0.0.0
      RUNTIME_HOST_DATA_ROOT: /var/lib/agent-runlab
      RUNTIME_HOST_MAX_LOADED_UNITS: 100
      RUNTIME_HOST_DOCS_DIR: /app/docs
      RUNTIME_HOST_RELEASE_ASSETS_DIR: /app/release
      RUNTIME_HOST_LLM_CATALOG_FILE: /etc/agent-runlab/runtime-provider-catalog.json
      RUNTIME_HOST_SECRET_ROOT: /run/agent-runlab-secrets
      AGENT_RUNLAB_DEPLOYMENT_CONFIG: /etc/agent-runlab/deployment.json
      AK_ALLOW_ALL_OK: ${AK_ALLOW_ALL_OK:-1}
      RUNTIME_INGRESS_SHARED_SECRET_FILE: /run/agent-runlab-secrets/ingress_secret
    volumes:
      - tenant-data:/var/lib/agent-runlab
      - host-secrets:/run/agent-runlab-secrets:ro
      - ${RUNLAB_PROVIDER_CATALOG_FILE:-./local/runtime-provider-catalog.json}:/etc/agent-runlab/runtime-provider-catalog.json:ro
      - ${RUNLAB_DEPLOYMENT_CONFIG_FILE:-./deployment.json}:/etc/agent-runlab/deployment.json:ro
    networks: [runtime, egress]
    depends_on:
      init-volumes: { condition: service_completed_successfully }
      init-app-secrets: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:13002/internal/health',{headers:{'x-agent-runlab-ingress-secret':require('fs').readFileSync('/run/agent-runlab-secrets/ingress_secret','utf8').trim()}}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=128m"
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0

  dashboard:
    image: ${RUNLAB_DASHBOARD_IMAGE:?RUNLAB_DASHBOARD_IMAGE must be an immutable name@sha256 digest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [runtime]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m"
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

  runtime-ingress:
    image: ${RUNLAB_INGRESS_IMAGE:?RUNLAB_INGRESS_IMAGE must be an immutable name@sha256 digest}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    ports:
      - ${RUNLAB_LISTEN_ADDRESS:-127.0.0.1}:${RUNLAB_PORT:-13001}:13001
    environment:
      RUNTIME_INGRESS_PORT: 13001
      RUNTIME_INGRESS_LISTEN_HOST: 0.0.0.0
      INGRESS_PUBLIC_ORIGIN: ${RUNLAB_PUBLIC_ORIGIN:-http://localhost:13001}
      RUNTIME_HOST_ORIGIN: http://runtime-host:13002
      RUNTIME_DASHBOARD_ORIGIN: http://dashboard:8080
      RUNTIME_INGRESS_IDENTITY_ORIGIN: ${OIDC_DISCOVERY_ORIGIN:?set OIDC_DISCOVERY_ORIGIN in the ignored deployment environment}
      RUNTIME_INGRESS_DATABASE_URL_FILE: /run/agent-runlab-secrets/control_database_url
      RUNTIME_INGRESS_LOGIN_STATE_STORE: /var/lib/agent-runlab-control/login-states.json
      RUNTIME_INGRESS_SESSION_SECRET_FILE: /run/agent-runlab-secrets/session_secret
      RUNTIME_INGRESS_SHARED_SECRET_FILE: /run/agent-runlab-secrets/ingress_secret
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in the ignored deployment environment}
      RUNTIME_INGRESS_ALLOW_INSECURE_HTTP: ${RUNLAB_ALLOW_INSECURE_HTTP:-0}
      OIDC_CLIENT_ID_FILE: /run/agent-runlab-secrets/oidc_client_id
      OIDC_CLIENT_SECRET_FILE: /run/agent-runlab-secrets/oidc_client_secret
    volumes:
      - control-data:/var/lib/agent-runlab-control
      - gateway-secrets:/run/agent-runlab-secrets:ro
    networks: [edge, runtime, control]
    depends_on:
      init-volumes: { condition: service_completed_successfully }
      init-app-secrets: { condition: service_completed_successfully }
      control-plane-init: { condition: service_completed_successfully }
      runtime-host: { condition: service_healthy }
      dashboard: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "require('http').get({host:'127.0.0.1',port:13001,path:'/healthz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0

networks:
  control:
    internal: true
  runtime:
    internal: true
  edge: {}
  egress: {}

volumes:
  control-postgres-data: {}
  tenant-data: {}
  control-data: {}
  host-secrets: {}
  gateway-secrets: {}

secrets:
  control_postgres_password: { file: "${RUNLAB_SECRETS_DIR:-./.secrets}/control_postgres_password" }
  session_secret: { file: "${RUNLAB_SECRETS_DIR:-./.secrets}/session_secret" }
  ingress_secret: { file: "${RUNLAB_SECRETS_DIR:-./.secrets}/ingress_secret" }
  oidc_client_id: { file: "${RUNLAB_SECRETS_DIR:-./.secrets}/oidc_client_id" }
  oidc_client_secret: { file: "${RUNLAB_SECRETS_DIR:-./.secrets}/oidc_client_secret" }
  llm_api_key: { file: "${RUNLAB_SECRETS_DIR:-./.secrets}/llm_api_key" }
