services:
  nfs-server:
    image: hectorm/nfs-ganesha@sha256:93df70b78aae56957f4a4f5c606c4250d84b729435f76132dca07b7290f5bfce
    restart: unless-stopped
    ports:
      - ${KALA_NFS_LISTEN_ADDRESS:-127.0.0.1}:${KALA_NFS_PORT:-12049}:2049
    volumes:
      - nfs-session-data:/export
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
      - /recovery:rw,noexec,nosuid,size=32m
    networks:
      nfs:
        ipv4_address: ${KALA_NFS_CONTAINER_ADDRESS:-192.0.2.9}
    healthcheck:
      test: [CMD-SHELL, "pidof ganesha.nfsd >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID, SETGID, SETUID, SYS_RESOURCE]
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  init-volumes:
    depends_on:
      nfs-server: { condition: service_healthy }

volumes:
  tenant-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${KALA_NFS_CONTAINER_ADDRESS:-192.0.2.9},nfsvers=4.2,rw,hard,timeo=600,retrans=2"
      device: ":/"
  nfs-session-data: {}

networks:
  nfs:
    ipam:
      config:
        - subnet: ${KALA_NFS_SUBNET:-192.0.2.0/24}
