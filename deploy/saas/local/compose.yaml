name: agent-runlab-saas

services:
  nfs-server:
    image: hectorm/nfs-ganesha@sha256:93df70b78aae56957f4a4f5c606c4250d84b729435f76132dca07b7290f5bfce
    restart: unless-stopped
    ports:
      - 127.0.0.1:12049:2049
    volumes:
      - nfs-session-data:/export
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
      - /recovery:rw,noexec,nosuid,size=32m
    networks:
      nfs:
        ipv4_address: 192.0.2.9
    healthcheck:
      test: [CMD-SHELL, "pidof ganesha.nfsd >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID, SETGID, SETUID, SYS_RESOURCE]
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

  init-volumes:
    image: alpine:3.22.2
    user: "0:0"
    command: [/bin/sh, -ec, "mkdir -p /tenant /control && chown -R 10001:10001 /tenant /control && chmod 700 /tenant /control"]
    volumes:
      - tenant-data:/tenant
      - control-data:/control
    networks: [runtime]
    depends_on:
      nfs-server: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true

  init-app-secrets:
    image: alpine:3.22.2
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        cp /run/secrets/ingress_secret /host/ingress_secret
        cp /run/secrets/llm_api_key /host/llm_api_key
        cp /run/secrets/ingress_secret /gateway/ingress_secret
        cp /run/secrets/session_secret /gateway/session_secret
        cp /run/secrets/oidc_client_id /gateway/oidc_client_id
        cp /run/secrets/oidc_client_secret /gateway/oidc_client_secret
        printf 'postgresql://runlab:%s@control-postgres:5432/runlab_control?sslmode=disable' "$$(cat /run/secrets/postgres_password)" > /gateway/control_database_url
        chown -R 10001:10001 /host /gateway
        chmod 700 /host /gateway
        chmod 400 /host/* /gateway/*
    secrets: [ingress_secret, llm_api_key, session_secret, oidc_client_id, oidc_client_secret, postgres_password]
    volumes:
      - host-secrets:/host
      - gateway-secrets:/gateway
    networks: [runtime]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true

  control-postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: runlab_control
      POSTGRES_USER: runlab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, pg_isready -d runlab_control -U runlab]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 200
    mem_limit: 512m
    cpus: 0.5

  control-plane-init:
    build:
      context: ../../..
      dockerfile: deploy/saas/images/Dockerfile.runtime-ingress-gateway
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/postgres_password)"
        export RUNTIME_INGRESS_ADMIN_DATABASE_URL="postgresql://runlab:$$password@control-postgres:5432/postgres?sslmode=disable"
        export RUNTIME_INGRESS_DATABASE_URL="postgresql://runlab:$$password@control-postgres:5432/runlab_control?sslmode=disable"
        export RUNTIME_INGRESS_MIGRATIONS_DIR=/app/packages/runtime-ingress-gateway/migrations
        node /app/packages/runtime-ingress-gateway/dist/src/bin/init-control-plane.js
        chown -R 10001:10001 /control
        if [ -f /control/tenant-directory.json ]; then
          export RUNTIME_INGRESS_JSON_DIRECTORY=/control/tenant-directory.json
          export RUNTIME_INGRESS_JSON_SESSIONS=/control/login-states.json.sessions
          export RUNTIME_INGRESS_JSON_BACKUP_PREFIX=/control/pre-postgres
          node /app/packages/runtime-ingress-gateway/dist/src/bin/import-json-control.js
        fi
    secrets: [postgres_password]
    volumes:
      - control-data:/control
    networks: [control]
    depends_on:
      control-postgres: { condition: service_healthy }
      init-volumes: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

  runtime-host:
    build:
      context: ../../..
      dockerfile: deploy/saas/images/Dockerfile.runtime-service
    restart: unless-stopped
    environment:
      RUNTIME_HOST_PORT: 13002
      RUNTIME_HOST_LISTEN_HOST: 0.0.0.0
      RUNTIME_HOST_DATA_ROOT: /var/lib/agent-runlab
      RUNTIME_HOST_MAX_LOADED_UNITS: 100
      RUNTIME_HOST_DASHBOARD_DIR: /app/packages/dashboard/dist
      RUNTIME_HOST_DOCS_DIR: /app/docs
      RUNTIME_HOST_RELEASE_ASSETS_DIR: /app/release
      RUNTIME_HOST_LLM_CATALOG_FILE: /etc/agent-runlab/runtime-provider-catalog.json
      RUNTIME_HOST_SECRET_ROOT: /run/agent-runlab-secrets
      AK_ALLOW_ALL_OK: ${AK_ALLOW_ALL_OK:-1}
      RUNTIME_INGRESS_SHARED_SECRET_FILE: /run/agent-runlab-secrets/ingress_secret
    volumes:
      - tenant-data:/var/lib/agent-runlab
      - host-secrets:/run/agent-runlab-secrets:ro
      - ./runtime-provider-catalog.json:/etc/agent-runlab/runtime-provider-catalog.json:ro
    networks: [runtime, egress]
    depends_on:
      init-volumes: { condition: service_completed_successfully }
      init-app-secrets: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:13002/internal/health',{headers:{'x-agent-runlab-ingress-secret':require('fs').readFileSync('/run/agent-runlab-secrets/ingress_secret','utf8').trim()}}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=128m"
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0

  runtime-ingress:
    build:
      context: ../../..
      dockerfile: deploy/saas/images/Dockerfile.runtime-ingress-gateway
    restart: unless-stopped
    ports:
      - 127.0.0.1:13001:13001
    environment:
      RUNTIME_INGRESS_PORT: 13001
      RUNTIME_INGRESS_LISTEN_HOST: 0.0.0.0
      INGRESS_PUBLIC_ORIGIN: http://localhost:13001
      RUNTIME_HOST_ORIGIN: http://runtime-host:13002
      RUNTIME_INGRESS_IDENTITY_ORIGIN: https://<identity-domain>
      RUNTIME_INGRESS_DATABASE_URL_FILE: /run/agent-runlab-secrets/control_database_url
      RUNTIME_INGRESS_LOGIN_STATE_STORE: /var/lib/agent-runlab-control/login-states.json
      RUNTIME_INGRESS_SESSION_SECRET_FILE: /run/agent-runlab-secrets/session_secret
      RUNTIME_INGRESS_SHARED_SECRET_FILE: /run/agent-runlab-secrets/ingress_secret
      OIDC_ISSUER: https://<identity-domain>
      RUNTIME_INGRESS_ALLOW_INSECURE_HTTP: "0"
      OIDC_CLIENT_ID_FILE: /run/agent-runlab-secrets/oidc_client_id
      OIDC_CLIENT_SECRET_FILE: /run/agent-runlab-secrets/oidc_client_secret
    volumes:
      - control-data:/var/lib/agent-runlab-control
      - gateway-secrets:/run/agent-runlab-secrets:ro
    networks: [edge, runtime, control]
    depends_on:
      init-volumes: { condition: service_completed_successfully }
      init-app-secrets: { condition: service_completed_successfully }
      control-plane-init: { condition: service_completed_successfully }
      runtime-host: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "require('http').get({host:'127.0.0.1',port:13001,path:'/healthz'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0

networks:
  control:
    internal: true
  runtime:
    internal: true
  edge: {}
  egress: {}
  nfs:
    ipam:
      config:
        - subnet: 192.0.2.8/24

volumes:
  control-postgres-data: {}
  # Runtime Host still mounts a real NFS-backed Docker Volume. Its server and
  # backing bytes are also Docker-managed by this same SaaS stack.
  tenant-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.0.2.9,nfsvers=4.2,rw,hard,timeo=600,retrans=2"
      device: ":/"
  nfs-session-data: {}
  control-data: {}
  host-secrets: {}
  gateway-secrets: {}

secrets:
  postgres_password: { file: ../.secrets/postgres_password }
  session_secret: { file: ../.secrets/session_secret }
  ingress_secret: { file: ../.secrets/ingress_secret }
  oidc_client_id: { file: ../.secrets/oidc_client_id }
  oidc_client_secret: { file: ../.secrets/oidc_client_secret }
  llm_api_key: { file: ../.secrets/llm_api_key }
