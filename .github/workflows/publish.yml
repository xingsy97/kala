name: Publish npm workspaces

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm through Corepack
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:version -- --tag "${GITHUB_REF_NAME}"
      - run: pnpm run privacy:history
      - run: pnpm run verify:licenses
      - run: pnpm run typecheck
      - run: pnpm run test:fast
      - run: pnpm run verify:public-packages
      - name: Publish public workspaces in dependency order
        run: node scripts/release/publish-workspaces.mjs --tag "${GITHUB_REF_NAME}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
