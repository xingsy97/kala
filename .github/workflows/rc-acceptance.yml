name: RC Clean-environment Acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify
        required: true

permissions:
  contents: read
  attestations: read

concurrency:
  group: rc-acceptance-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.tag }}', fetch-depth: 0 }
      - id: release
        env: { TAG: '${{ inputs.tag }}' }
        run: |
          set -euo pipefail
          node scripts/release/version-policy.mjs --tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  portable:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, asset: agent-kernel-host-linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, asset: agent-kernel-host-linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64, asset: agent-kernel-host-darwin-x64 }
          - { os: macos-15, target: darwin-arm64, asset: agent-kernel-host-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.tag }}', fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Download and attest exact candidate Portable assets
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}', ASSET: '${{ matrix.asset }}' }
        run: |
          set -euo pipefail
          mkdir -p acceptance/candidate acceptance/evidence
          gh release download '${{ inputs.tag }}' --pattern "$ASSET" --dir acceptance/candidate
          gh release download '${{ inputs.tag }}' --pattern SHA256SUMS --dir acceptance/candidate
          gh release download '${{ inputs.tag }}' --pattern manifest.json --dir acceptance/candidate
          gh attestation verify "acceptance/candidate/$ASSET" --repo "$GITHUB_REPOSITORY"
          gh attestation verify acceptance/candidate/manifest.json --repo "$GITHUB_REPOSITORY"
          gh attestation verify acceptance/candidate/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          node scripts/release/verify-checksum-index.mjs --index acceptance/candidate/SHA256SUMS --asset "acceptance/candidate/$ASSET" --manifest acceptance/candidate/manifest.json --revision '${{ needs.resolve.outputs.revision }}'
      - name: Prove clean install, state continuity, and same-version reinstall
        shell: bash
        run: |
          node scripts/release/verify-portable-native.mjs \
            --asset 'acceptance/candidate/${{ matrix.asset }}' \
            --target '${{ matrix.target }}' --tag '${{ inputs.tag }}' \
            --revision '${{ needs.resolve.outputs.revision }}' \
            --output 'acceptance/evidence/portable-${{ matrix.target }}.rc-evidence.json'
      - uses: actions/upload-artifact@v5
        with:
          name: rc-evidence-portable-${{ matrix.target }}
          path: acceptance/evidence/*.rc-evidence.json
          if-no-files-found: error
          retention-days: 90
