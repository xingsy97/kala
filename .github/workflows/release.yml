name: GitHub Release Assets

on:
  push:
    tags:
      - 'v*'
      - 'host-v*'
      - 'executor-v*'
      - 'dashboard-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish assets to, for example v0.1.0 or host-v0.1.0'
        required: true
      component:
        description: 'Asset group to publish: all, host, executor, or dashboard'
        type: choice
        options:
          - ''
          - all
          - host
          - executor
          - dashboard
        required: false
        default: ''
      native_targets:
        description: 'Comma-separated native targets to build: any of linux-x64, darwin-x64, win32-x64. Empty = linux-x64 only.'
        required: false
        default: 'linux-x64'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      component: ${{ steps.release.outputs.component }}
      native_targets: ${{ steps.release.outputs.native_targets }}
      native_matrix: ${{ steps.release.outputs.native_matrix }}
      has_native: ${{ steps.release.outputs.has_native }}
    steps:
      - name: Resolve release target
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            COMPONENT="${{ inputs.component }}"
            NATIVE_TARGETS="${{ inputs.native_targets }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            COMPONENT=""
            NATIVE_TARGETS=""
          fi

          if [ -z "$COMPONENT" ]; then
            case "$TAG" in
              host-v*) COMPONENT="host" ;;
              executor-v*) COMPONENT="executor" ;;
              dashboard-v*) COMPONENT="dashboard" ;;
              v*) COMPONENT="all" ;;
              *)
                echo "Cannot infer release component from tag $TAG" >&2
                exit 1
                ;;
            esac
          fi

          case "$COMPONENT" in
            all|host|executor|dashboard) ;;
            *)
              echo "Unknown component $COMPONENT" >&2
              exit 1
              ;;
          esac

          if [ -z "$NATIVE_TARGETS" ]; then
            NATIVE_TARGETS="linux-x64"
          fi
          MATRIX_ENTRIES=""
          for t in $(echo "$NATIVE_TARGETS" | tr ',' ' '); do
            case "$t" in
              linux-x64) OS="ubuntu-latest" ;;
              darwin-x64) OS="macos-13" ;;
              win32-x64) OS="windows-latest" ;;
              *) echo "Unsupported native target: $t (allowed: linux-x64, darwin-x64, win32-x64)" >&2; exit 1 ;;
            esac
            ENTRY="{\"os\":\"$OS\",\"target\":\"$t\"}"
            if [ -z "$MATRIX_ENTRIES" ]; then
              MATRIX_ENTRIES="$ENTRY"
            else
              MATRIX_ENTRIES="$MATRIX_ENTRIES,$ENTRY"
            fi
          done
          NATIVE_MATRIX="{\"include\":[$MATRIX_ENTRIES]}"
          if [ -n "$MATRIX_ENTRIES" ]; then
            HAS_NATIVE="true"
          else
            HAS_NATIVE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "native_targets=$NATIVE_TARGETS" >> "$GITHUB_OUTPUT"
          echo "native_matrix=$NATIVE_MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_native=$HAS_NATIVE" >> "$GITHUB_OUTPUT"

  native-assets:
    needs: resolve
    if: needs.resolve.outputs.component != 'dashboard' && needs.resolve.outputs.has_native == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --native-only --native-target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.target }}
          path: release/agent-kernel-*-${{ matrix.target }}*
          if-no-files-found: error

  cjs-release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test:extended
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --no-native
      - run: pnpm run verify:release-assets
      - name: Install-time smoke on release assets (host + dashboard bundle)
        if: needs.resolve.outputs.component == 'all' || needs.resolve.outputs.component == 'host'
        run: pnpm run verify:release-install
      - uses: actions/upload-artifact@v5
        with:
          name: cjs-release-assets
          path: release/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMPONENT: ${{ needs.resolve.outputs.component }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release/RELEASE_NOTES.md
            gh release delete-asset "$TAG" run-host.sh --yes || true
            gh release delete-asset "$TAG" run-executor.sh --yes || true
            gh release delete-asset "$TAG" agent-kernel-host.cjs --yes || true
            for asset in \
              agent-kernel-host-linux-x64 agent-kernel-host-linux-arm64 agent-kernel-host-darwin-x64 agent-kernel-host-darwin-arm64 agent-kernel-host-win32-x64.exe agent-kernel-host-win32-arm64.exe \
              agent-kernel-executor-linux-x64 agent-kernel-executor-linux-arm64 agent-kernel-executor-darwin-x64 agent-kernel-executor-darwin-arm64 agent-kernel-executor-win32-x64.exe agent-kernel-executor-win32-arm64.exe; do
              gh release delete-asset "$TAG" "$asset" --yes || true
            done
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --notes-file release/RELEASE_NOTES.md
          fi

  native-release:
    needs: [resolve, cjs-release, native-assets]
    if: always() && needs.resolve.result == 'success' && needs.cjs-release.result == 'success' && needs.native-assets.result == 'success' && needs.resolve.outputs.component != 'dashboard' && needs.resolve.outputs.has_native == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: cjs-release-assets
          path: release
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Restore executable bit on downloaded assets
        run: |
          find release -maxdepth 1 -type f \( -name 'agent-kernel-*' -o -name '*.cjs' -o -name '*.sh' \) -print0 \
            | xargs -0 -r chmod +x
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --finalize-only
      - run: pnpm run verify:release-assets
      - name: Upload native assets and refreshed metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release edit "$TAG" --notes-file release/RELEASE_NOTES.md
          gh release upload "$TAG" release/* --clobber
