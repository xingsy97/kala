name: GitHub Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Product release tag, for example v0.2.0-rc.1'
        required: true
      native_targets:
        description: 'Comma-separated native targets. Empty builds Linux x64 and macOS x64/arm64.'
        required: false
        # Linux arm64 is paused for the current RC: linux-x64,linux-arm64,darwin-x64,darwin-arm64
        default: 'linux-x64,darwin-x64,darwin-arm64'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      component: ${{ steps.release.outputs.component }}
      native_targets: ${{ steps.release.outputs.native_targets }}
      native_matrix: ${{ steps.release.outputs.native_matrix }}
      has_native: ${{ steps.release.outputs.has_native }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve release target
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            NATIVE_TARGETS="${{ inputs.native_targets }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            NATIVE_TARGETS=""
          fi
          COMPONENT="all"
          node scripts/release/version-policy.mjs --tag "$TAG"

          if [ -z "$NATIVE_TARGETS" ]; then
            # Linux arm64 is paused for the current RC: linux-x64,linux-arm64,darwin-x64,darwin-arm64
            NATIVE_TARGETS="linux-x64,darwin-x64,darwin-arm64"
          fi
          # Linux arm64 is paused for the current RC: REQUIRED_NATIVE_TARGETS="linux-x64,linux-arm64,darwin-x64,darwin-arm64"
          REQUIRED_NATIVE_TARGETS="linux-x64,darwin-x64,darwin-arm64"
          if [ "$NATIVE_TARGETS" != "$REQUIRED_NATIVE_TARGETS" ]; then
            echo "native_targets must be exactly $REQUIRED_NATIVE_TARGETS; partial three-platform RC releases are not supported" >&2
            exit 1
          fi
          MATRIX_ENTRIES=""
          for t in $(echo "$NATIVE_TARGETS" | tr ',' ' '); do
            case "$t" in
              linux-x64) OS="ubuntu-24.04" ;;
              # linux-arm64) OS="ubuntu-24.04-arm" ;; # Paused for the current RC.
              darwin-x64) OS="macos-15-intel" ;;
              darwin-arm64) OS="macos-15" ;;
              *) echo "Unsupported native target: $t" >&2; exit 1 ;;
            esac
            ENTRY="{\"os\":\"$OS\",\"target\":\"$t\"}"
            if [ -z "$MATRIX_ENTRIES" ]; then
              MATRIX_ENTRIES="$ENTRY"
            else
              MATRIX_ENTRIES="$MATRIX_ENTRIES,$ENTRY"
            fi
          done
          NATIVE_MATRIX="{\"include\":[$MATRIX_ENTRIES]}"
          if [ -n "$MATRIX_ENTRIES" ]; then
            HAS_NATIVE="true"
          else
            HAS_NATIVE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "native_targets=$NATIVE_TARGETS" >> "$GITHUB_OUTPUT"
          echo "native_matrix=$NATIVE_MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_native=$HAS_NATIVE" >> "$GITHUB_OUTPUT"

  native-assets:
    needs: resolve
    if: needs.resolve.outputs.has_native == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - run: pnpm run build
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --native-only --native-target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.target }}
          path: release/kala-*-${{ matrix.target }}*
          if-no-files-found: error

  cjs-release:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test:extended
      - run: pnpm run privacy:history
      - run: pnpm run verify:licenses
      - run: pnpm run verify:public-packages
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --no-native
      - run: pnpm run verify:release-assets
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }} --manifest release/manifest.json
      - name: Install-time smoke on release assets
        run: pnpm run verify:release-install
      - name: Remove Windows-only downloads from the candidate
        run: |
          rm -f release/*.ps1 release/*.exe release/*win32* release/*windows* release/*conpty* release/*winpty*
      - uses: actions/upload-artifact@v5
        with:
          name: cjs-release-assets
          path: release/*
          if-no-files-found: error

      - name: Stage draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes-file release/RELEASE_NOTES.md
          fi
          node scripts/release/reconcile-github-release-assets.mjs --tag "$TAG" --directory release

  native-release:
    needs: [resolve, cjs-release, native-assets]
    if: always() && needs.resolve.result == 'success' && needs.cjs-release.result == 'success' && needs.native-assets.result == 'success' && needs.resolve.outputs.has_native == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          name: cjs-release-assets
          path: release
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Restore executable bit on downloaded assets
        run: |
          find release -maxdepth 1 -type f \( -name 'kala-*' -o -name '*.cjs' -o -name '*.sh' \) -print0 \
            | xargs -0 -r chmod +x
      - run: pnpm run build:release-assets -- --component ${{ needs.resolve.outputs.component }} --tag ${{ needs.resolve.outputs.tag }} --repo ${{ github.repository }} --finalize-only
      - name: Require installable desktop Executor assets
        run: |
          test -f release/kala-executor-linux-x64
          # test -f release/kala-executor-linux-arm64 # Paused for the current RC.
          test -f release/kala-executor-darwin-x64
          test -f release/kala-executor-darwin-arm64
          test "$(find release -maxdepth 1 -type f -name 'kala-executor-*' | wc -l)" -eq 3
          ! find release -maxdepth 1 -type f \( -iname '*.ps1' -o -iname '*.exe' -o -iname '*.msi' -o -iname '*.dll' -o -iname '*win32*' -o -iname '*windows*' -o -iname '*conpty*' -o -iname '*winpty*' \) -print -quit | grep -q .
      - run: pnpm run verify:release-assets
      - run: pnpm run verify:version -- --tag ${{ needs.resolve.outputs.tag }} --manifest release/manifest.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksum index with Sigstore keyless identity
        run: cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
      - name: Attest final release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/manifest.json
            release/SHA256SUMS
            release/sbom.cdx.json
            release/kala-dashboard-with-runtime.cjs
            release/kala-host-*
            release/kala-executor-*
      - name: Upload native assets and refreshed metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft --notes-file release/RELEASE_NOTES.md
          node scripts/release/reconcile-github-release-assets.mjs --tag "$TAG" --directory release
