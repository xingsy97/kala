name: Browser and Security

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        layer: [browser, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install pinned security scanners
        if: matrix.layer == 'security'
        env:
          SYFT_VERSION: v1.30.0
          GRYPE_VERSION: v0.99.1
          TRIVY_VERSION: v0.74.0
          COSIGN_VERSION: v2.6.0
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          curl -sSfL -o /tmp/cosign-linux-amd64 "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -sSfL -o /tmp/cosign_checksums.txt "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          (cd /tmp && grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c -)
          install -m 0755 /tmp/cosign-linux-amd64 /usr/local/bin/cosign
      - if: matrix.layer == 'browser'
        run: pnpm run ci:browser
      - if: matrix.layer == 'security'
        run: pnpm run ci:security
      - name: Scan release filesystem with Grype and Trivy
        if: matrix.layer == 'security'
        run: |
          mkdir -p "${{ runner.temp }}/vulnerability-reports"
          syft dir:. -o cyclonedx-json="${{ runner.temp }}/vulnerability-reports/source.cdx.json"
          grype sbom:"${{ runner.temp }}/vulnerability-reports/source.cdx.json" -o json > "${{ runner.temp }}/vulnerability-reports/grype.json"
          trivy fs --scanners vuln --format json --output "${{ runner.temp }}/vulnerability-reports/trivy.json" .
          node scripts/security/check-vulnerabilities.mjs \
            --grype "${{ runner.temp }}/vulnerability-reports/grype.json" \
            --trivy "${{ runner.temp }}/vulnerability-reports/trivy.json" \
            --output "${{ runner.temp }}/vulnerability-reports/normalized.json"
      - uses: actions/upload-artifact@v5
        if: always() && matrix.layer == 'security'
        with:
          name: vulnerability-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/vulnerability-reports
          if-no-files-found: error
          retention-days: 30
