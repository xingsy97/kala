name: Browser and Security

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        layer: [browser, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install pinned security scanners
        if: matrix.layer == 'security'
        env:
          SYFT_VERSION: v1.30.0
          SYFT_SHA256: f0cdcba0b6ce4c7a87050d524f732ba9fa2e711835f993a4ef108cfbf928ec13
          GRYPE_VERSION: v0.99.1
          GRYPE_SHA256: 7fde4d45fe097daa2554078cd9e81faa43e51266a888337f5446c1ffc42d451f
          TRIVY_VERSION: v0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          COSIGN_VERSION: v2.6.0
          COSIGN_SHA256: ea5c65f99425d6cfbb5c4b5de5dac035f14d09131c1a0ea7c7fc32eab39364f9
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          curl -sSfL --retry 3 -o /tmp/grype.tar.gz "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  /tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C /usr/local/bin grype
          curl -sSfL --retry 3 -o /tmp/trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          curl -sSfL -o /tmp/cosign-linux-amd64 "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /tmp/cosign-linux-amd64" | sha256sum -c -
          install -m 0755 /tmp/cosign-linux-amd64 /usr/local/bin/cosign
      - uses: browser-actions/setup-chrome@v2
        if: matrix.layer == 'browser'
        id: chrome
      - if: matrix.layer == 'browser'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm run ci:browser
      - if: matrix.layer == 'security'
        run: pnpm run build:release-assets -- --tag latest --repo "$GITHUB_REPOSITORY" --no-native --skip-dashboard-build --skip-package-build && pnpm run verify:release-assets
      - if: matrix.layer == 'security'
        run: pnpm run ci:security
      - name: Scan shipped files and production dependency inventory with Grype and Trivy
        if: matrix.layer == 'security'
        run: |
          set -euo pipefail
          reports="${{ runner.temp }}/vulnerability-reports"
          metadata="${{ runner.temp }}/release-metadata"
          mkdir -p "$reports"
          node scripts/release/extract-release-metadata.mjs release/kala-release-metadata.tar.gz "$metadata"
          # The workspace includes build-only tools and an old Go compiler in
          # esbuild. Scan the actual release bytes and its complete --prod SBOM,
          # not dev-only node_modules or the development lockfile. The extractor
          # first enforces the metadata archive's exact regular-file inventory.
          syft dir:release -o cyclonedx-json="$reports/release.cdx.json"
          grype sbom:"$reports/release.cdx.json" -o json > "$reports/release-grype.json"
          trivy fs --scanners vuln --format json --output "$reports/release-trivy.json" release
          node scripts/security/check-vulnerabilities.mjs \
            --grype "$reports/release-grype.json" \
            --trivy "$reports/release-trivy.json" \
            --output "$reports/release-normalized.json"
          grype sbom:"$metadata/sbom.cdx.json" -o json > "$reports/dependencies-grype.json"
          trivy sbom --scanners vuln --format json --output "$reports/dependencies-trivy.json" "$metadata/sbom.cdx.json"
          node scripts/security/check-vulnerabilities.mjs \
            --grype "$reports/dependencies-grype.json" \
            --trivy "$reports/dependencies-trivy.json" \
            --output "$reports/dependencies-normalized.json"
      - uses: actions/upload-artifact@v5
        if: always() && matrix.layer == 'security'
        with:
          name: vulnerability-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/vulnerability-reports
          if-no-files-found: warn
          retention-days: 30
