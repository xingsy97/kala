name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - typecheck
          - test
          - swebench-smoke
          - release-assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run ${{ matrix.task }}
        run: |
          case "${{ matrix.task }}" in
            typecheck)
              pnpm run typecheck
              ;;
            test)
              pnpm run test
              ;;
            swebench-smoke)
              pnpm run verify:swebench-smoke
              ;;
            release-assets)
              pnpm run build:release-assets -- --no-native --repo ${{ github.repository }}
              pnpm run verify:release-assets
              ;;
          esac
