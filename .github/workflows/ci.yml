name: Fast PR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: privacy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Scan repository snapshot
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: node scripts/security/privacy-check.mjs --repository
      - name: Scan complete Git history
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: node scripts/security/privacy-check.mjs --range HEAD
      - name: Scan pull request commit range
        if: github.event_name == 'pull_request'
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: node scripts/security/privacy-check.mjs --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan pushed commit range
        if: github.event_name == 'push'
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A rewritten branch may no longer contain its previous tip. The
          # complete-history step above still checks every reachable commit.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/security/privacy-check.mjs --range "$AFTER"
          else
            node scripts/security/privacy-check.mjs --range "$BEFORE..$AFTER"
          fi

  fast:
    name: typecheck / unit / boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run ci:fast
      - run: pnpm run verify:licenses
      - name: Recent product regression matrix
        run: node scripts/testing/verify-recent-product-regressions.mjs

  kernel-formal:
    name: kernel formal model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned TLA+ tools
        run: |
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  ${RUNNER_TEMP}/tla2tools.jar" \
            | sha256sum -c -
      - name: Model-check Kernel safety and progress
        run: |
          java -XX:+UseParallelGC -cp "${RUNNER_TEMP}/tla2tools.jar" tlc2.TLC \
            -workers auto \
            -config formal/kernel/Kernel.cfg \
            formal/kernel/Kernel.tla
