name: SaaS Product E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

concurrency:
  group: saas-product-e2e
  cancel-in-progress: false

jobs:
  two-tenant-product:
    name: local IdP / shared origin / two Units
    runs-on: [self-hosted, linux, x64, saas-local]
    timeout-minutes: 60
    env:
      SAAS_TEST_ALICE_EMAIL: ${{ secrets.SAAS_TEST_ALICE_EMAIL }}
      SAAS_TEST_ALICE_PASSWORD: ${{ secrets.SAAS_TEST_ALICE_PASSWORD }}
      SAAS_TEST_BOB_EMAIL: ${{ secrets.SAAS_TEST_BOB_EMAIL }}
      SAAS_TEST_BOB_PASSWORD: ${{ secrets.SAAS_TEST_BOB_PASSWORD }}
      SAAS_TEST_EMAIL: ${{ secrets.SAAS_TEST_ALICE_EMAIL }}
      SAAS_TEST_PASSWORD: ${{ secrets.SAAS_TEST_ALICE_PASSWORD }}
      SAAS_WORKSPACE_MARKER: saas-${{ github.run_id }}
      PRODUCT_E2E_EVIDENCE_ROOT: ${{ runner.temp }}/evidence/saas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Strict environment preflight
        run: |
          set -eu
          for value in SAAS_TEST_ALICE_EMAIL SAAS_TEST_ALICE_PASSWORD SAAS_TEST_BOB_EMAIL SAAS_TEST_BOB_PASSWORD; do
            test -n "$(printenv "$value")"
          done
          curl -fsS http://localhost:13001/runtime/capabilities >/dev/null
          test -n "$(docker compose ps -q)"
          mkdir -p "${{ runner.temp }}/evidence"
      - name: Validate local SaaS deployment policy
        run: pnpm run saas:validate && pnpm run saas:check
      - name: Verify two-tenant isolation
        run: node scripts/saas-local/acceptance/verify-tenant-isolation.mjs | tee ${{ runner.temp }}/evidence/tenant-isolation.json
      - name: Verify complete Workspace task chain
        run: node scripts/saas-local/acceptance/verify-full-workspace.mjs | tee ${{ runner.temp }}/evidence/full-workspace.json
      - name: Verify raw tenant isolation contracts
        run: pnpm run verify:evaluation-product-dashboard-integration && pnpm run verify:evaluation-control-plane-authority
      - name: Upload SaaS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-product-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30
