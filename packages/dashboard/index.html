<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Kala</title>
    <link rel="icon" type="image/svg+xml" href="/icons/octopus-web.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="application-name" content="Kala" />
    <meta name="description" content="Web UI for the agent-kernel host: run coding agents, monitor sessions, approve tool calls." />
    <!-- iOS PWA integration. iOS 16.4+ recognises `apple-mobile-web-app-*`
         + a 180x180 apple-touch-icon; only in standalone mode does iOS grant
         PushManager access. viewport-fit=cover above enables safe-area insets. -->
    <link rel="apple-touch-icon" href="/icons/octopus-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kala" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Resolve the effective theme before the first paint. A persisted
      // `system` preference must follow the OS here just as it does after React
      // mounts; otherwise dark-system users see a light cold-start splash.
      try {
        var storedTheme = localStorage.getItem('ak-theme')
        var t = storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system' ? storedTheme : 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (_) {
        var fallbackDark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', fallbackDark)
        document.documentElement.style.colorScheme = fallbackDark ? 'dark' : 'light'
      }
    </script>
    <style>
      /* Pure-CSS splash shown from the first paint until React replaces
         #root. No JS, no bundle dependency, no extra network request — this
         is what fixes the blank screen on mobile / PWA cold starts where the
         12MB bundle takes a moment to download and parse. React's
         createRoot().render() clears #root, so the splash disappears
         automatically once the app mounts. Theme-aware (light/dark) and
         reduced-motion aware. */
      #ak-splash {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        color: #0b0b0f;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 2147483647;
        overflow: hidden;
        /* One opaque paint layer is intentional. Large blurred layers can be
           rasterized as separate top/bottom tiles by mobile WebKit during a
           standalone PWA cold start, briefly producing a split screen. */
        background: #f6f7fb;
        animation: ak-splash-in 320ms ease-out both;
      }
      html.dark #ak-splash {
        color: #f4f4f5;
        background: #0b0b0f;
      }

      #ak-splash .ak-splash-badge {
        position: relative;
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
      }
      /* Orbiting conic ring around the logo. */
      #ak-splash .ak-splash-badge::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(from 0deg, transparent 0deg, #6366f1 90deg, #38bdf8 200deg, transparent 300deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        animation: ak-splash-spin 1.5s linear infinite;
      }
      /* Soft halo glow that breathes. */
      #ak-splash .ak-splash-badge::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, rgba(99, 102, 241, 0.35), transparent 65%);
        filter: blur(8px);
        animation: ak-splash-pulse 1.8s ease-in-out infinite;
      }
      #ak-splash .ak-splash-logo {
        position: relative;
        width: 64px;
        height: 64px;
        z-index: 1;
        animation: ak-splash-pulse 1.8s ease-in-out infinite;
      }
      #ak-splash .ak-splash-name {
        position: relative;
        font: 700 clamp(22px, 4.8vw, 30px)/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.025em;
        background: linear-gradient(90deg, currentColor 0%, #818cf8 40%, #38bdf8 60%, currentColor 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: ak-splash-shimmer 2.6s ease-in-out infinite;
      }
      @keyframes ak-splash-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes ak-splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes ak-splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.82; }
      }
      @keyframes ak-splash-shimmer {
        0%, 100% { background-position: 120% 0; }
        50% { background-position: -20% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #ak-splash,
        #ak-splash .ak-splash-badge::before,
        #ak-splash .ak-splash-badge::after,
        #ak-splash .ak-splash-logo,
        #ak-splash .ak-splash-name { animation: none !important; }
        #ak-splash .ak-splash-name { color: currentColor; -webkit-text-fill-color: currentColor; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground">
    <div id="root">
      <div id="ak-splash" role="status" aria-label="Loading Kala">
        <div class="ak-splash-badge">
          <img class="ak-splash-logo" src="/icons/octopus-web.svg" alt="" width="64" height="64" />
        </div>
        <div class="ak-splash-name">Kala</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
