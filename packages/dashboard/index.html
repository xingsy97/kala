<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agent RunLab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="application-name" content="Agent RunLab" />
    <meta name="description" content="Web UI for the agent-kernel host: run coding agents, monitor sessions, approve tool calls." />
    <!-- iOS PWA integration. iOS 16.4+ recognises `apple-mobile-web-app-*`
         + a 180x180 apple-touch-icon; only in standalone mode does iOS grant
         PushManager access. viewport-fit=cover above enables safe-area insets. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RunLab" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Read the persisted theme before React mounts so the initial paint
      // matches the user's last choice — otherwise the page flashes dark
      // before hydrating into light mode. Default: dark.
      try {
        var t = localStorage.getItem('ak-theme') || 'dark'
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (_) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
